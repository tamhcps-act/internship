};
function saveSettings(){
  const p = prog();
  p.name = val("st_pname") || p.name; p.facilitator = val("st_fac");
  p.email = val("st_femail"); p.phone = val("st_fphone");
  Object.assign(DB.settings, {
    requiredHours:+val("st_req")||60, requiredObs:+val("st_obs")||2,
    termStart:val("st_ts"), termEnd:val("st_te"), defaultStart:val("st_ds"), defaultEnd:val("st_de"),
    absenceAlert:+val("st_abs")||3, obsGraceDays:+val("st_grace")||21});
  saveDB(); render(); toast("Settings saved.");
}
function addProgram(){
  openModal({title:"Add a program", narrow:true,
    body:`<label class="f">Program name</label><input class="in" id="pg_n" placeholder="Teacher Academy — …">
      <label class="f" style="margin-top:10px">Facilitator</label><input class="in" id="pg_f">
      <label class="f" style="margin-top:10px">Email</label><input class="in" id="pg_e">
      <p class="hint">A new program starts empty. Import a roster and add schools once it is open.</p>`,
    foot:`<div class="fill"></div><button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn pri" id="pgSave">Create program</button>`,
    after(){ $("#pgSave").onclick = () => {
      if(!val("pg_n")) return toast("Give the program a name.", true);
      const id = uid("prog");
      DB.programs.push({id, name:val("pg_n"), facilitator:val("pg_f"), email:val("pg_e"), phone:""});
      DB.activeProgramId = id; saveDB(); closeAllModals(); go("students"); toast("Program created.");
    };}});
}
function deleteProgram(id){
  const pr = DB.programs.find(x => x.id === id);
  confirmAction("Delete "+pr.name+"?", "Every student, school, teacher, placement and record inside it goes too.", () => {
    ["students","schools","teachers","placements","sessions","observations","comms","tasks","events","evaluations"]
      .forEach(k => DB[k] = DB[k].filter(r => r.programId !== id));
    DB.programs = DB.programs.filter(x => x.id !== id);
    if(P() === id) DB.activeProgramId = DB.programs[0].id;
    saveDB(); render(); toast("Program deleted.");
  });
}
function backup(){
  download("practicum-backup-"+today()+".json", JSON.stringify(DB,null,2), "application/json");
  toast("Backup downloaded.");
}
function restore(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch(e){ return toast("That file is not a Practicum backup.", true); }
    if(!data || !data.programs || !data.students) return toast("That file is missing program data.", true);
    confirmAction("Restore this backup?", "It replaces everything currently in Practicum — "+
      data.students.length+" students and "+data.programs.length+" program(s) will take its place.", () => {
      DB = data;
      if(!DB.dismissed) DB.dismissed = [];
      if(!DB.forms) DB.forms = [];
      DB.settings.formOverrides = DB.settings.formOverrides || {};
      DB.settings.templates = DB.settings.templates || {};
      saveDB(); go("dashboard"); toast("Backup restored.");
    }, "Restore");
  };
  r.readAsText(f);
  input.value = "";
}
function startEmpty(){
  openModal({title:"Erase the sample data", narrow:true,
    body:`<p style="margin:0 0 10px;font-size:14px">This clears everything the demonstration program came with and leaves you
        one empty program to start entering your own students and schools.</p>
      <label class="f">Name your program</label>
      <input class="in" id="se_name" value="${attr(prog().name)}">
      <div class="fgrid" style="margin-top:10px">
        <div><label class="f">Facilitator</label><input class="in" id="se_fac" value="${attr(prog().facilitator)}"></div>
        <div><label class="f">Email</label><input class="in" id="se_email" value="${attr(prog().email)}"></div>
      </div>
      <p class="hint">Your email templates, your forms and your internship settings are kept. Download a backup first if you
        want the sample program to be recoverable.</p>`,
    foot:`<button class="btn" onclick="backup()">Download a backup first</button>
          <div class="fill"></div><button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn dang" id="seGo">Erase and start empty</button>`,
    after(){ $("#seGo").onclick = () => {
      const name = val("se_name") || "Teacher Academy";
      const id = uid("prog");
      const keptTemplates = DB.settings.templates || {};
      const keptOverrides = DB.settings.formOverrides || {};
      const keptForms = (DB.forms || []).map(f => Object.assign({}, f, {programId:id}));
      DB = {
        version:1, updatedAt:new Date().toISOString(), activeProgramId:id,
        programs:[{id, name, facilitator:val("se_fac"), email:val("se_email"), phone:prog().phone||""}],
        settings:Object.assign({}, DB.settings, {templates:keptTemplates, formOverrides:keptOverrides}),
        students:[], schools:[], teachers:[], placements:[], sessions:[], observations:[],
        comms:[], tasks:[], events:[], evaluations:[], forms:keptForms, dismissed:[]
      };
      saveDB(); closeAllModals(); go("students");
      toast("Sample data erased. Import a roster or add your first school.");
    };}});
}
function resetAll(){
  confirmAction("Reset Practicum to the sample program?",
    "Everything you have entered in this browser is replaced by the demonstration data.", () => {
    DB = seedActivity(seed()); saveDB(); go("dashboard"); toast("Reset to sample data.");
  }, "Reset");
}

/* =========================================================================
   Start
   ========================================================================= */
(async function init(){
  DB = await loadDB();
  if(!DB || !DB.programs || !DB.programs.length){
    DB = seedActivity(seed());
    await saveDB(true);
  }
  DB.dismissed = DB.dismissed || [];
  DB.forms = DB.forms || [];
  DB.settings = Object.assign({requiredHours:60,requiredObs:2,obsGraceDays:14,absenceAlert:3,
    termStart:"2026-08-31",termEnd:"2026-12-11",defaultStart:"09:00",defaultEnd:"11:00"}, DB.settings||{});
  DB.settings.templates = DB.settings.templates || {};
  if(!DB.programs.some(p => p.id === DB.activeProgramId)) DB.activeProgramId = DB.programs[0].id;
  UI.calDate = today();
  const hash = (location.hash||"").replace("#","");
  VIEW = RENDER[hash] ? hash : "dashboard";
  renderNav(); render();
})();
window.addEventListener("hashchange", () => {
  const h = (location.hash||"").replace("#","");
  if(RENDER[h] && h !== VIEW){ VIEW = h; renderNav(); render(); }
});
</script>

function mapCSV(text){
  text = (text||"").trim();
  if(!text) return {rows:[], used:[], error:""};
  if(text.includes("\t") && !text.includes(",")) text = text.split("\n").map(l => l.split("\t").join(",")).join("\n");
  const rows = parseCSV(text);
  if(rows.length < 2) return {rows:[], used:[], error:"Add a header row and at least one student row."};
  const norm = s => String(s).toLowerCase().replace(/[^a-z]/g,"");
  const head = rows[0].map(norm);
  const find = (...names) => { for(const n of names){ const i = head.indexOf(norm(n)); if(i >= 0) return i; } return -1; };
  const M = {
    first:find("first","firstname","fname","given"), last:find("last","lastname","lname","surname"),
    full:find("name","studentname","fullname"),
    studentId:find("studentid","id","sid","idnumber"), grade:find("grade","gradelevel","yr"),
    gradYear:find("gradyear","graduationyear","classof"), email:find("email","studentemail","schoolemail"),
    band:find("preferredgrade","preferredgradelevel","gradepreference","band"),
    content:find("contentarea","content","subject","preferredcontent"),
    second:find("secondcontent","secondarycontent","secondaryinterest"),
    career:find("career","careerinterest","teachinginterest","interest"),
    transport:find("transportation","transport"), transportNotes:find("transportationnotes","transportnotes"),
    requiredHours:find("requiredhours","hoursrequired"),
    parentName:find("parent","guardian","parentname","guardianname"),
    parentEmail:find("parentemail","guardianemail"), parentPhone:find("parentphone","guardianphone","phone"),
    notes:find("notes","comment","comments")
  };
  const used = Object.keys(M).filter(k => M[k] >= 0);
  const out = [];
  const matchOne = (v, list) => { const s = String(v||"").trim(); if(!s) return null;
    return list.find(x => x.toLowerCase().includes(s.toLowerCase().slice(0,6))) || null; };
  rows.slice(1).forEach(r => {
    const g = i => i >= 0 ? String(r[i]||"").trim() : "";
    let first = g(M.first), last = g(M.last);
    if((!first || !last) && M.full >= 0){
      const nm = g(M.full);
      if(nm.includes(",")){ const p = nm.split(","); last = p[0].trim(); first = (p[1]||"").trim(); }
      else { const p = nm.split(" "); first = p.shift()||""; last = p.join(" "); }
    }
    if(!first && !last) return;
    const rec = {
      first, last, studentId:g(M.studentId), grade:g(M.grade)||"11", gradYear:g(M.gradYear), email:g(M.email),
      career:g(M.career), transport:matchOne(g(M.transport),TRANSPORT)||"Drives self",
      transportNotes:g(M.transportNotes), parentName:g(M.parentName), parentEmail:g(M.parentEmail),
      parentPhone:g(M.parentPhone), notes:g(M.notes)
    };
    const b = matchOne(g(M.band),BANDS); if(b) rec.prefBands = [b];
    const c = matchOne(g(M.content),CONTENT); if(c) rec.prefContent = [c];
    const s2 = matchOne(g(M.second),CONTENT); if(s2) rec.secondContent = [s2];
    if(g(M.requiredHours)) rec.requiredHours = +g(M.requiredHours) || null;
    out.push(rec);
  });
  return {rows:out, used, error: out.length ? "" : "No usable rows — check that a name column exists."};
}

/* ------------------------------------------------ TAM combined spreadsheet
   One row = a teacher's request plus the student they're asking for.
   Creates/updates the cooperating teacher (and their school) and the
   student, but never a placement — there's no schedule in this sheet, so
   placing still goes through the usual Match tool. */
const TAM_HEADERS = ["Teacher Name","Teacher HCPS Email","Teacher School","Are you a special educator?",
  "Teacher Content Area/Grade Levels:","Your Program:","TAM Site","Student Email","Student Last","Student First",
  "Preferred Name","Level Request","Grade Request","Content Request","Teacher Request","TAM Teacher",
  "School Nurse","Parent","Parent Contact"];
function guessTeacherContent(text){
  text = String(text||"").toLowerCase();
  const aliases = [
    ["General elementary",["general elementary","self-contained"]],
    ["English / Language arts",["language arts","english","ela","reading"]],
    ["Mathematics",["math"]],
    ["Science",["science"]],
    ["Social studies",["social studies","history","civics","geography"]],
    ["Special education",["special education","sped","exceptional student","esE"]],
    ["World language",["world language","spanish","french","foreign language"]],
    ["Visual & performing arts",["visual art","performing art","drama","theatre","theater"," art"]],
    ["Physical education / Health",["physical education","health"," pe "]],
    ["Music",["music","band","chorus","orchestra"]],
    ["Career & technology",["career & tech","career and tech","cte","technology"]],
    ["Media / Library",["media","library"]],
    ["Counseling & student services",["counseling","student services"]],
    ["STEM / Computer science",["stem","computer science","coding"]]
  ];
  for(const [k,words] of aliases) if(words.some(w => text.includes(w))) return k;
  return "";
}
function guessTeacherGrade(text){
  text = String(text||"");
  if(/pre-?k(indergarten)?/i.test(text)) return "PreK";
  const nums = (text.match(/\d{1,2}/g)||[]).filter(n => GRADES.includes(n));
  if(nums.length) return nums[0];
  if(/\bK\b/i.test(text) || /kindergarten/i.test(text)) return "K";
  return "";
}
function mapTAMRoster(text){
  text = (text||"").trim();
  if(!text) return {rows:[], error:""};
  if(text.includes("\t") && !text.includes(",")) text = text.split("\n").map(l => l.split("\t").join(",")).join("\n");
  const rows = parseCSV(text);
  if(rows.length < 2) return {rows:[], error:"Add a header row and at least one data row."};
  const norm = s => String(s).toLowerCase().replace(/[^a-z]/g,"");
  const head = rows[0].map(norm);
  const find = (...names) => { for(const n of names){ const i = head.indexOf(norm(n)); if(i >= 0) return i; } return -1; };
  const M = {
    teacherName:find("Teacher Name"), teacherEmail:find("Teacher HCPS Email","Teacher Email"),
    teacherSchool:find("Teacher School"), specialEd:find("Are you a special educator?","Special educator"),
    teacherContentGrade:find("Teacher Content Area/Grade Levels:","Teacher Content Area/Grade Levels"),
    program:find("Your Program:","Your Program"), tamSite:find("TAM Site"),
    studentEmail:find("Student Email"), studentLast:find("Student Last"), studentFirst:find("Student First"),
    preferredName:find("Preferred Name"), levelRequest:find("Level Request"), gradeRequest:find("Grade Request"),
    contentRequest:find("Content Request"), teacherRequest:find("Teacher Request"), tamTeacher:find("TAM Teacher"),
    schoolNurse:find("School Nurse"), parent:find("Parent"), parentContact:find("Parent Contact")
  };
  if(M.teacherName < 0 && M.studentFirst < 0 && M.studentLast < 0)
    return {rows:[], error:"Couldn't find the expected headers — check the column names match exactly."};
  const matchOne = (v, list) => { const s = String(v||"").trim(); if(!s) return null;
    return list.find(x => x.toLowerCase().includes(s.toLowerCase().slice(0,6))) || null; };
  const yesNo = v => /^\s*(y|yes|true|x)\s*$/i.test(String(v||""));
  const out = [];
  rows.slice(1).forEach(r => {
    const g = i => i >= 0 ? String(r[i]||"").trim() : "";
    const first = g(M.studentFirst), last = g(M.studentLast), teacherName = g(M.teacherName);
    if(!first && !last && !teacherName) return;
    const contentGrade = g(M.teacherContentGrade);
    const parentContact = g(M.parentContact);
    const levelMatch = matchOne(g(M.levelRequest), BANDS);
    // Content Request often comes from a multi-select checkbox question, exported
    // as semicolon-separated choices (e.g. "Social Studies;Science;Math;") — match
    // every token, not just the first, so no selection gets silently dropped.
    const contentChoices = [...new Set(g(M.contentRequest).split(";").map(t => matchOne(t.trim(), CONTENT)).filter(Boolean))];
    const gradeRequest = g(M.gradeRequest);
    const guessedGrade = guessTeacherGrade(contentGrade);
    // A self-contained elementary teacher's answer is often just a grade
    // ("3rd grade teacher", "Kindergarten") with no subject named at all —
    // that means General elementary, not "couldn't tell".
    const guessedContent = guessTeacherContent(contentGrade) ||
      (["PreK","K","1","2","3","4","5"].includes(guessedGrade) ? "General elementary" : "");
    out.push({
      teacher: teacherName ? {
        name: teacherName, email: g(M.teacherEmail), schoolName: g(M.teacherSchool),
        specialEducator: yesNo(g(M.specialEd)), program: g(M.program), tamSite: g(M.tamSite),
        contentArea: guessedContent, gradeLevel: guessedGrade
      } : null,
      student: (first || last) ? {
        first, last, email: g(M.studentEmail), preferredName: g(M.preferredName),
        grade: ["9","10","11","12"].includes(gradeRequest) ? gradeRequest : "11",
        prefBands: levelMatch ? [levelMatch] : [], prefContent: contentChoices.slice(0,1),
        secondContent: contentChoices.slice(1),
        teacherRequest: g(M.teacherRequest), tamTeacher: g(M.tamTeacher), schoolNurse: g(M.schoolNurse),
        parentName: g(M.parent), parentEmail: parentContact.includes("@") ? parentContact : "",
        parentPhone: parentContact && !parentContact.includes("@") ? parentContact : ""
      } : null
    });
  });
  return {rows:out, error: out.length ? "" : "No usable rows — check that a teacher or student name column has data."};
}

                notes:"", specialEducator:tRec.specialEducator, program:tRec.program, tamSite:tRec.tamSite});
              teachersAdded++;
            }
          }
          if(row.student){
            const sRec = row.student;
            const dupe = students().find(x =>
              (sRec.email && x.email && x.email.toLowerCase() === sRec.email.toLowerCase()) ||
              (x.first.toLowerCase() === sRec.first.toLowerCase() && x.last.toLowerCase() === sRec.last.toLowerCase()));
            if(dupe){ studentsSkipped++; return; }
            DB.students.push(Object.assign({id:uid("s"), programId:P(), createdAt:today(),
              secondContent:[], career:"", transport:"Drives self", transportNotes:"", requiredHours:null,
              hoursAdjust:0, status:"Unplaced", notes:"", gradYear:""}, sRec));
            studentsAdded++;
          }
        });
        saveDB(); closeModal(); render();
        const parts = [];
        if(teachersAdded) parts.push(teachersAdded+" teacher"+(teachersAdded===1?"":"s")+" added");
        if(teachersUpdated) parts.push(teachersUpdated+" teacher"+(teachersUpdated===1?"":"s")+" updated");
        if(schoolsAdded) parts.push(schoolsAdded+" school"+(schoolsAdded===1?"":"s")+" added");
        parts.push(studentsAdded+" student"+(studentsAdded===1?"":"s")+" imported"+
          (studentsSkipped?", "+studentsSkipped+" duplicate"+(studentsSkipped===1?"":"s")+" skipped":""));
        toast(parts.join(" · ")+".");
      };
    }});
}

function deleteSchool(id){
  const n = teachers().filter(t => t.schoolId === id).length;
  const p = placements().filter(x => x.schoolId === id && ["Active","Confirmed"].includes(x.status)).length;
  if(p) return toast("Close the "+p+" live placement"+(p===1?"":"s")+" at this school first.", true);
  confirmAction("Delete "+schName(id)+"?", n+" cooperating teacher record"+(n===1?"":"s")+" will go with it.", () => {
    DB.schools = DB.schools.filter(x => x.id !== id);
    DB.teachers = DB.teachers.filter(x => x.schoolId !== id);
    saveDB(); closeAllModals(); render(); toast("School deleted.");
  });
}

/* =========================================================================
   Placements + the matching engine
   ========================================================================= */
function bandFor(grade){
  const g = String(grade);
  if(["PreK","K","1","2"].includes(g)) return "Early childhood (PreK–2)";
  if(["3","4","5"].includes(g)) return "Elementary (3–5)";
  if(["6","7","8"].includes(g)) return "Middle (6–8)";
  return "High (9–12)";
}
function transportRisk(student, school){
  const notes = (student.transportNotes||"").toLowerCase();
  const out = [];
  if(!school) return out;
  if(["Needs assistance"].includes(student.transport) && school.distanceMiles > 0.5)
    out.push("No transportation on file and this school is "+school.distanceMiles+" miles away.");
  if(student.transport === "School bus" && school.distanceMiles > 1.5)
    out.push("Bus rider — getting to a school "+school.distanceMiles+" miles off campus is a problem.");
  if(student.transport === "Public transit" && school.distanceMiles > 4)
    out.push("Relies on the city bus; "+school.distanceMiles+" miles is likely out of range.");
  if(school.driveMinutes > 15)
    out.push("About "+school.driveMinutes+" minutes each way — check it against the bell schedule.");
  if(/1:30|cannot leave|can't leave/.test(notes))
    out.push("Student note: “"+student.transportNotes+"”");
  return out;
}
function scoreMatch(student, teacher){
  const school = sch(teacher.schoolId);
  const why = [], flags = [];
  let score = 0;
  const band = bandFor(teacher.gradeLevel);
  if((student.prefBands||[]).includes(band)){ score += 32; why.push("Teaches "+band+", which is what the student asked for."); }
  else { flags.push("Grade band is "+band+", not the student's preference."); score += 4; }
  if((student.prefContent||[]).includes(teacher.contentArea)){ score += 28; why.push("Content area matches: "+teacher.contentArea+"."); }
  else if((student.secondContent||[]).includes(teacher.contentArea)){ score += 16; why.push(teacher.contentArea+" is on the student's secondary interest list."); }
  else if(teacher.contentArea === "General elementary" && (student.prefContent||[]).some(c => ["General elementary","English / Language arts","Mathematics","Science","Social studies"].includes(c))){
    score += 10; why.push("A self-contained elementary room covers the student's subject interest."); }
  else flags.push("Content area is "+teacher.contentArea+".");
  const cap = teacherCapacity(teacher.id);
  if(cap > 0){ score += 18; why.push(teacher.name+" has room for "+cap+" more intern"+(cap===1?"":"s")+"."); }
  else { score -= 40; flags.push("At capacity — "+teacherLoad(teacher.id)+" of "+teacher.maxInterns+" seats used."); }
  if(teacherLoad(teacher.id) < teacher.preferredInterns) score += 5;
  if(!school || !school.active){ score -= 50; flags.push("School is not accepting interns this year."); }
  const risks = transportRisk(student, school);
  if(!risks.length){ score += 14; why.push(school ? (school.distanceMiles === 0 ? "In-building — no travel at all." : school.distanceMiles+" miles from campus, no transportation conflict.") : ""); }
  else { score -= 6 * risks.length; risks.forEach(r => flags.push(r)); }
  if((teacher.days||[]).length >= 2){ score += 8; why.push("Open to interns on "+teacher.days.join(", ")+"."); }
  else if((teacher.days||[]).length === 1){ score += 3; flags.push("Only available on "+teacher.days[0]+" — one long day would be needed to reach the hours."); }
  const need = student.requiredHours || DB.settings.requiredHours;
  const weeks = Math.max(1, Math.round(daysBetween(DB.settings.termStart, DB.settings.termEnd)/7));
  const perWeek = (teacher.days||[]).length * 2;
  if(perWeek * weeks >= need){ score += 5; why.push("Two hours on each available day clears "+need+" hours before the term ends."); }
  else flags.push("At two hours per visit this pattern falls short of "+need+" hours — longer sessions will be needed.");
  if(student.career && teacher.contentArea && student.career.toLowerCase().includes(teacher.contentArea.toLowerCase().split(" ")[0]))
    { score += 4; why.push("Lines up with the student's stated goal: "+student.career+"."); }
  return {teacher, school, score:Math.max(0,Math.min(100,score)), why:why.filter(Boolean), flags};
}

  const t = tch(val("p_t")); if(!t) return;

function closedDates(){
  return new Set(events().filter(e => ["holiday","noschool","pd"].includes(e.type)).map(e => e.date));
}
function countSessions(days, start, end){
  if(!days.length || !start || !end || start > end) return 0;
  const closed = closedDates();
  let n = 0, d = start, guard = 0;
  while(d <= end && guard++ < 600){ if(days.includes(dayAbbr(d)) && !closed.has(d)) n++; d = addDays(d,1); }
  return n;
}
/* builds future sessions from a placement pattern; never touches logged history */
function buildSessions(p, fromDate){
  const from = fromDate || (p.startDate > today() ? p.startDate : today());
  const keep = DB.sessions.filter(s => !(s.placementId === p.id && s.date >= from && s.status === "Scheduled"));
  DB.sessions = keep;
  const closed = closedDates();
  const existing = new Set(DB.sessions.filter(s => s.placementId === p.id).map(s => s.date));
  let d = p.startDate < from ? from : p.startDate, guard = 0, made = 0;
  while(d <= p.endDate && guard++ < 600){
    if(p.days.includes(dayAbbr(d)) && !closed.has(d) && !existing.has(d)){
      DB.sessions.push({id:uid("ses"), programId:P(), studentId:p.studentId, placementId:p.id, date:d,
        schedStart:p.startTime, schedEnd:p.endTime, actualStart:null, actualEnd:null,
        hours:0, status:"Scheduled", activity:"", reflection:"", verified:false, notes:""});
      made++;
    }
    d = addDays(d,1);
  }
  return made;
}
function regenerateSessions(pid){
  const p = plc(pid); if(!p) return;
  const n = buildSessions(p);
  saveDB(); openStudent(p.studentId,"sched"); toast(n+" session"+(n===1?"":"s")+" rebuilt from today forward.");
}

function calStep(n){
  const d = parseISO(UI.calDate);
  if(UI.calMode === "month") d.setMonth(d.getMonth()+n);
  else if(UI.calMode === "week") d.setDate(d.getDate()+7*n);
  else if(UI.calMode === "day") d.setDate(d.getDate()+n);
  else d.setDate(d.getDate()+14*n);
  UI.calDate = iso(d); render();
}
function calMonth(dateStr){
  const d = parseISO(dateStr);
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const start = addDays(iso(first), -first.getDay());
  const cells = [];
  for(let i=0;i<42;i++){
    const day = addDays(start,i);
    const inMonth = parseISO(day).getMonth() === d.getMonth();
    const items = dayItems(day);
    const closedToday = events().some(e => e.date === day && ["holiday","noschool"].includes(e.type));
    cells.push(`<div class="cell ${inMonth?"":"off"} ${day===today()?"today":""}">
      <div class="dn"><b>${parseISO(day).getDate()}</b>${closedToday?`<span class="flag">closed</span>`:""}</div>
      ${items.slice(0,4).map(it => `<button class="ev ${it.cls}" title="${attr(it.title+" — "+(it.sub||""))}"
          onclick="${it.click||""}">${esc(it.title)}</button>`).join("")}
      ${items.length>4?`<button class="ev more" onclick="UI.calMode='day';UI.calDate='${day}';render()">${items.length-4} more</button>`:""}
    </div>`);
  }
  return `<div class="calgrid">
    <div class="calhead">${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].map(x=>`<div>${x}</div>`).join("")}</div>
    <div class="calbody">${cells.join("")}</div></div>`;
}
function calWeek(dateStr){
  const start = addDays(dateStr, -dow(dateStr)+1);
  return `<div class="wk">${[0,1,2,3,4].map(i => {
    const day = addDays(start,i);
    const items = dayItems(day);
    return `<div class="wkcol"><h4>${dayAbbr(day)} ${fmtDate(day)}${day===today()?" · today":""}</h4>
      <div class="body">${items.length ? items.map(it =>
        `<button class="ev ${it.cls}" style="white-space:normal" onclick="${it.click||""}">
          <b>${esc(it.title)}</b><br><span style="font-size:11px">${esc(it.sub||"")}</span></button>`).join("")
        : `<span class="sm2">Nothing scheduled</span>`}</div></div>`;
  }).join("")}</div>`;
}
function calDay(dateStr){
  const items = dayItems(dateStr);
  return `<div class="card"><h2>${fmtDateFull(dateStr)}</h2>
    ${items.length ? `<div class="list">${items.map(it => `<div class="row">
      <span class="pri-dot" style="background:${it.color}"></span>
      <div class="gr"><div class="ttl">${esc(it.title)}</div><div class="mt">${esc(it.sub||"")}</div></div>
      ${it.click?`<button class="btn sm" onclick="${it.click}">Open</button>`:""}</div>`).join("")}</div>`
      : `<div class="empty"><b>Nothing on this day</b><p>No internships, observations, or school events.</p>
         <button class="btn" onclick="editEvent(null,'${dateStr}')">Add an event</button></div>`}</div>`;
}
function calAgenda(dateStr){
  const days = [];
  for(let i=0;i<21;i++){
    const day = addDays(dateStr,i);
    const items = dayItems(day);
    if(items.length) days.push({day, items});
  }
  if(!days.length) return `<div class="card"><div class="empty"><b>The next three weeks are clear</b><p>Nothing scheduled from ${fmtDate(dateStr,true)}.</p></div></div>`;
  return `<div class="card agenda" style="padding:0">${days.map(d => `<div class="day">
    <div class="dh">${fmtDateFull(d.day)}</div>
    ${d.items.map(it => `<button class="ev ${it.cls}" style="white-space:normal;max-width:640px" onclick="${it.click||""}">
      <b>${esc(it.title)}</b> — ${esc(it.sub||"")}</button>`).join("")}</div>`).join("")}</div>`;
}

function commRecipientLabel(c){
  const names = (c.recipientIds||[]).map(id =>
    c.recipientKind === "student" ? stuName(id) :
    c.recipientKind === "teacher" ? tchName(id) :
    c.recipientKind === "school"  ? schName(id) :
    c.recipientKind === "parent"  ? (stu(id) ? stu(id).parentName || stuName(id)+"'s guardian" : "—") : id);
  return names.join(", ") || "—";
}
function recipientEmails(kind, ids){
  return (ids||[]).map(id =>
    kind === "student" ? (stu(id)||{}).email :
    kind === "teacher" ? (tch(id)||{}).email :
    kind === "school"  ? (sch(id)||{}).contactEmail :
    kind === "parent"  ? (stu(id)||{}).parentEmail : "").filter(Boolean);
}
function mergeFields(ctx){
  const s = ctx.studentId ? stu(ctx.studentId) : null;
  const p = s ? activePlacement(s.id) : null;
  const t = ctx.teacherId ? tch(ctx.teacherId) : (p ? tch(p.teacherId) : null);
  const sc = ctx.schoolId ? sch(ctx.schoolId) : (p ? sch(p.schoolId) : (t ? sch(t.schoolId) : null));
  const pr = prog();
  return {
    student: s ? s.first+" "+s.last : "the student",
    first: s ? s.first : "the student",
    grade: s ? s.grade : "",
    studentId: s ? s.studentId : "",
    gradYear: s ? s.gradYear : "",
    prefBands: s ? (s.prefBands||[]).join(", ") : "",
    prefContent: s ? (s.prefContent||[]).join(", ") : "",
    studentEmail: s ? s.email : "",
    career: s ? (s.career || "teaching") : "",
    guardian: s ? (s.parentName || "parent or guardian") : "parent or guardian",
    guardianEmail: s ? s.parentEmail : "",
    guardianPhone: s ? s.parentPhone : "",
    transport: s ? s.transport : "",
    transportNotes: s ? (s.transportNotes || "none on file") : "",
    school: sc ? sc.name : "your school",
    schoolAddress: sc ? sc.address : "",
    schoolContact: sc ? (sc.contactName || "colleague") : "colleague",
    schoolLevel: sc ? sc.level : "",
    schoolPhone: sc ? sc.phone : "",
    schoolAdmins: sc ? (sc.admins||[]).map(a => a.name + (a.role?" ("+a.role+")":"") + (a.email?" "+a.email:"")).join("; ") : "",
    schoolDistance: sc ? (sc.distanceMiles + " miles · about " + sc.driveMinutes + " minutes") : "",
    schoolFilled: sc ? schoolFilled(sc.id) : "",
    schoolOpen: sc ? schoolCapacity(sc.id) : "",
    teacher: t ? t.name : "the cooperating teacher",
    teacherEmail: t ? t.email : "",
    teacherGrade: t ? "Grade "+t.gradeLevel : "",
    teacherContent: t ? t.contentArea : "",
    teacherDays: t ? (t.days||[]).join(", ") : "",
    teacherLoad: t ? teacherLoad(t.id) : "",
    teacherMax: t ? t.maxInterns : "",
    days: p ? p.days.join(" and ") : "",
    times: p ? timeRange(p.startTime, p.endTime) : "",
    dates: p ? fmtDateFull(p.startDate)+" through "+fmtDateFull(p.endDate) : "",
    startDate: p ? fmtDateFull(p.startDate) : "",
    endDate: p ? fmtDateFull(p.endDate) : "",
    required: s ? hoursRequired(s.id) : DB.settings.requiredHours,
    completed: s ? hoursDone(s.id) : "",
    remaining: s ? hoursRemaining(s.id) : "",
    absences: s ? absenceCount(s.id) : 0,
    attendance: s ? (attendanceRate(s.id)??"—") : "",
    obsCount: s ? obsDone(s.id) : "",
    placementStatus: p ? p.status : "no placement yet",
    evalOnFile: s ? (evaluations().some(e => e.studentId === s.id) ? "Yes" : "No") : "",
    requiredObs: DB.settings.requiredObs,
    termStart: fmtDateFull(DB.settings.termStart),
    termEnd: fmtDateFull(DB.settings.termEnd),
    today: fmtDateFull(today()),
    facilitator: pr.facilitator, program: pr.name, femail: pr.email, fphone: pr.phone,
    signature: "\n\n" + pr.facilitator + "\n" + pr.name + "\n" + pr.email + (pr.phone ? " · "+pr.phone : ""),
    obsDate: (() => { const o = s ? studentObs(s.id).find(x => x.status==="Scheduled") : null;
      return o ? fmtDateFull(o.date)+" at "+fmtTime(o.time) : "a date we will confirm"; })()
  };
}

/* Replaces every {{field}} with the value for the student, teacher and school in context. */
function fillTemplate(str, m){
  return String(str == null ? "" : str).replace(/\{\{\s*([a-zA-Z]+)\s*\}\}/g,
    (whole, key) => (m[key] === undefined || m[key] === null) ? whole : String(m[key]));
}
function emailTypes(){
  return Array.from(new Set(EMAIL_TYPES.concat(Object.keys(DB.settings.templates || {}))));
}
function templateFor(type){
  const saved = (DB.settings.templates || {})[type];
  return saved || BUILTIN_TEMPLATES[type] || {s:"", b:""};
}
function isEditedTemplate(type){ return !!(DB.settings.templates || {})[type]; }
function isCustomTemplate(type){ return !BUILTIN_TEMPLATES[type]; }
function emailTemplate(type, ctx){
  const m = mergeFields(ctx);
  const t = templateFor(type);
  return {subject: fillTemplate(t.s, m), body: fillTemplate(t.b, m)};
}
function composeEmail(ctx){
  ctx = ctx || {};
  const kind = ctx.recipientKind || (ctx.teacherId ? "teacher" : ctx.schoolId ? "school" : ctx.studentId ? "student" : "teacher");
  const type = ctx.type || (kind === "school" ? "Request for placements" : kind === "student" ? "Internship schedule" : "Placement confirmation");
  const preselect = ctx.teacherId ? [ctx.teacherId] : ctx.schoolId ? [ctx.schoolId] : ctx.studentId ? [ctx.studentId] : [];
  closeAllModals();
  openModal({title:"Write an email", wide:true,
    body:`<div class="fgrid">
      <div><label class="f">Send to</label><select class="in" id="em_kind" onchange="emailKindChanged()">${selectOpts(
        [{v:"teacher",l:"Cooperating teacher"},{v:"school",l:"School administrator"},{v:"student",l:"Student"},
         {v:"parent",l:"Parent / guardian"}], kind)}</select></div>
      <div><label class="f">Email type</label><select class="in" id="em_type" onchange="emailRegen()">${selectOpts(emailTypes(),type)}</select></div>
      <div class="full" style="display:flex;gap:8px;align-items:center">
        <button class="btn sm" onclick="editTemplate(val('em_type'),true)">Edit this template</button>
        <span class="hint" id="em_tmark"></span></div>
      <div class="full"><label class="f">Recipients</label><div id="em_rec"></div>
        <div class="hint">Pick more than one to send the same message to a group.</div></div>
      <div class="full"><label class="f">About which student (fills the merge fields)</label>
        <select class="in" id="em_stu" onchange="emailRegen()">${selectOpts(
          students().map(s=>({v:s.id,l:s.first+" "+s.last})), ctx.studentId, "No specific student")}</select></div>
      <div class="full"><label class="f">Subject</label><input class="in" id="em_subj"></div>
      <div class="full"><label class="f">Message</label><textarea class="in" id="em_body" style="min-height:280px"></textarea></div>
      <div class="full"><label class="f">To</label><input class="in mono" id="em_to" readonly></div>
    </div>`,
    foot:`<button class="btn" onclick="emailRegen(true)">Reset to template</button>
          <div class="fill"></div>
          <button class="btn" id="em_copy">Copy</button>
          <button class="btn" id="em_mail">Open in mail</button>
          <button class="btn pri" id="em_log">Log as sent</button>`,
    after(){
      emailKindChanged(preselect);
      emailRegen(true);
      $("#em_copy").onclick = () => {
        const text = val("em_subj") + "\n\n" + val("em_body");
        navigator.clipboard.writeText(text).then(() => toast("Email copied."), () => toast("Copy failed — select and copy by hand.", true));
      };
      $("#em_mail").onclick = () => {
        const to = val("em_to");
        window.location.href = "mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(val("em_subj"))+
          "&body="+encodeURIComponent(val("em_body"));
      };
      $("#em_log").onclick = () => logEmail(false);
    }});
}
function emailKindChanged(preselect){
  const kind = val("em_kind");
  const list = kind === "teacher" ? teachers().map(t => ({v:t.id, l:t.name+" — "+schName(t.schoolId)}))
    : kind === "school" ? schools().map(s => ({v:s.id, l:s.name+" — "+s.contactName}))
    : students().map(s => ({v:s.id, l:s.first+" "+s.last + (kind==="parent"?" — "+(s.parentName||"guardian"):"")}));
  const sel = preselect || [];
  $("#em_rec").innerHTML = `<select class="in" id="em_ids" multiple size="5">${
    list.map(o => `<option value="${attr(o.v)}" ${sel.includes(o.v)?"selected":""}>${esc(o.l)}</option>`).join("")}</select>`;
  $("#em_ids").onchange = () => { emailTo(); emailRegen(); };
  emailTo();
}
function emailTo(){
  const kind = val("em_kind");
  const ids = Array.from(document.querySelectorAll("#em_ids option:checked")).map(o => o.value);
  $("#em_to").value = recipientEmails(kind, ids).join("; ");
  return ids;
}
function emailRegen(force){
  const ids = emailTo();
  const kind = val("em_kind");
  const ctx = {studentId: val("em_stu") || null};
  if(kind === "teacher" && ids[0]) ctx.teacherId = ids[0];
  if(kind === "school" && ids[0]) ctx.schoolId = ids[0];
  if((kind === "student" || kind === "parent") && ids[0] && !ctx.studentId) ctx.studentId = ids[0];
  const t = emailTemplate(val("em_type"), ctx);
  const mark = $("#em_tmark");
  if(mark) mark.textContent = isCustomTemplate(val("em_type")) ? "Your own template."
    : isEditedTemplate(val("em_type")) ? "Using your edited wording." : "Using the built-in wording.";
  const subj = $("#em_subj"), body = $("#em_body");
  if(force || !subj.value || !body.value || body.dataset.generated === "1"){
    subj.value = t.subject; body.value = t.body; body.dataset.generated = "1";
  }
  body.oninput = () => body.dataset.generated = "0";
}
function logEmail(){
  const kind = val("em_kind");
  const ids = Array.from(document.querySelectorAll("#em_ids option:checked")).map(o => o.value);
  if(!ids.length) return toast("Choose at least one recipient.", true);
  const studentId = val("em_stu") || ((kind==="student"||kind==="parent") ? ids[0] : null);
  const rec = {
    id:uid("cm"), programId:P(), date:today(), type:val("em_type"), recipientKind:kind, recipientIds:ids,
    subject:val("em_subj"), body:val("em_body"), status:"Sent",
    followUp: ["Request for placements","Follow-up","Attendance concern","Evaluation request"].includes(val("em_type"))
      ? addDays(today(),5) : null,
    studentId: studentId || null,
    teacherId: kind==="teacher" ? ids[0] : null,
    schoolId: kind==="school" ? ids[0] : (kind==="teacher" ? (tch(ids[0])||{}).schoolId : null)
  };
  if(rec.followUp) rec.status = "Awaiting reply";
  DB.comms.push(rec);
  saveDB(); closeAllModals(); render();
  toast("Logged to the communication history"+(rec.followUp?", with a follow-up flag in five days.":"."));
}
RENDER.comms = function(){
  const f = UI.filters.comms = UI.filters.comms || {status:"",type:""};
  let list = comms();
  if(f.status) list = list.filter(c => c.status === f.status);
  if(f.type) list = list.filter(c => c.type === f.type);
  list = list.sort((a,b) => a.date < b.date ? 1 : -1);
  const waiting = comms().filter(c => c.status === "Awaiting reply");
  return `
  <div class="phead">
    <div><h1>Communications</h1><p>${comms().length} messages on file · ${waiting.length} still waiting on a reply.</p></div>
    <div class="sp"><button class="btn" onclick="exportCSV('comms')">Export CSV</button>
      <button class="btn pri" onclick="composeEmail({})">Write an email</button></div>
  </div>
  ${waiting.length?`<div class="card" style="border-left:3px solid var(--gold)">
    <h3>No reply yet</h3>
    <div class="list">${waiting.map(c => `<div class="row">
      <div class="gr"><div class="ttl">${esc(c.subject)}</div>
        <div class="mt">${fmtDate(c.date)} · ${esc(c.type)} · to ${esc(commRecipientLabel(c))}${c.followUp?` · flagged for ${fmtDate(c.followUp)}`:""}</div></div>
      <button class="btn sm" onclick="markReplied('${c.id}')">Mark answered</button>
      <button class="btn sm pri" onclick="openComm('${c.id}')">Open</button></div>`).join("")}</div></div>`:""}
  <div class="toolbar">
    <select onchange="UI.filters.comms.type=this.value;render()">${selectOpts(emailTypes(),f.type,"Any type")}</select>
    <select onchange="UI.filters.comms.status=this.value;render()">${selectOpts(
      ["Draft","Sent","Awaiting reply","Closed"],f.status,"Any status")}</select>
    <div class="fill"></div><button class="btn sm gh" onclick="UI.filters.comms=null;render()">Clear</button>
  </div>
  ${table("comms",[{k:"d",label:"Date"},{k:"t",label:"Type"},{k:"r",label:"Recipient"},{k:"s",label:"Subject"},
      {k:"st",label:"Status"}],
    list.map(c => ({__:{d:c.date,t:c.type,r:commRecipientLabel(c),s:c.subject,st:c.status},
      click:`openComm('${c.id}')`,
      cells:[fmtDate(c.date), esc(c.type), `${esc(commRecipientLabel(c))}<div class="sm2">${esc(c.recipientKind)}</div>`,
        esc(c.subject), statusTag(c.status)]})),
    `<b>Nothing sent yet</b><p>Every email you generate is logged here against the student, teacher and school.</p>`)}`;
};
function openComm(id){
  const c = comms().find(x => x.id === id); if(!c) return;
  closeAllModals();
  openModal({title:c.subject || "(no subject)", wide:true,
    body:`<dl class="kv" style="margin-bottom:12px">
        <dt>Sent</dt><dd>${fmtDateFull(c.date)}</dd>
        <dt>Type</dt><dd>${esc(c.type)}</dd>
        <dt>To</dt><dd>${esc(commRecipientLabel(c))} <span class="sm2">${esc(recipientEmails(c.recipientKind,c.recipientIds).join("; "))}</span></dd>
        <dt>Status</dt><dd>${statusTag(c.status)}${c.followUp?` <span class="sm2">follow up ${fmtDate(c.followUp)}</span>`:""}</dd>
        ${c.studentId?`<dt>Student</dt><dd><a href="#" onclick="openStudent('${c.studentId}');return false">${esc(stuName(c.studentId))}</a></dd>`:""}
      </dl>
      ${c.body?`<div class="card" style="white-space:pre-wrap;font-size:13px;line-height:1.6">${esc(c.body)}</div>`
        :`<p class="hint">The body of this message was not saved — it predates the log or was sent from your mail client.</p>`}`,
    foot:`<button class="btn" onclick="markReplied('${id}')">Mark answered</button>
          <button class="btn" onclick="composeEmail({type:'Follow-up',studentId:${c.studentId?`'${c.studentId}'`:"null"},teacherId:${c.teacherId?`'${c.teacherId}'`:"null"},schoolId:${c.schoolId?`'${c.schoolId}'`:"null"}})">Follow up</button>
          <div class="fill"></div>
          <button class="btn dang" onclick="deleteComm('${id}')">Delete</button>`});
}
function markReplied(id){
  const c = comms().find(x => x.id === id); if(!c) return;
  c.status = "Closed"; c.followUp = null;
  saveDB(); closeAllModals(); render(); toast("Marked as answered.");
}
function deleteComm(id){
  DB.comms = DB.comms.filter(x => x.id !== id);
  saveDB(); closeAllModals(); render(); toast("Message removed from the log.");
}

RENDER.tasks = function(){
  const alerts = computeAlerts().filter(a => !a.id.startsWith("al_task_"));
  const open = tasks().filter(t => !t.done).sort((a,b) => (a.due||"9999") < (b.due||"9999") ? -1 : 1);
  const done = tasks().filter(t => t.done);
  const group = k => alerts.filter(a => a.priority === k);
  const block = (title, list) => !list.length ? "" : `<div class="card"><h3>${title}</h3>
    <div class="list">${list.map(a => `<div class="row">
      <span class="pri-dot ${a.priority==="High"?"hi":a.priority==="Medium"?"md":"lo"}"></span>
      <div class="gr"><div class="ttl">${esc(a.title)}</div><div class="mt">${esc(a.kind)}${a.detail?" · "+esc(a.detail):""}</div></div>
      <button class="btn sm" onclick="${a.act}">${esc(a.actLabel)}</button>
      <button class="btn sm gh" onclick="dismissAlert('${a.id}')" title="Dismiss">\u00D7</button></div>`).join("")}</div></div>`;
  return `
  <div class="phead">
    <div><h1>Tasks</h1><p>Automatic alerts from the data, plus anything you add yourself.</p></div>
    <div class="sp">
      ${(DB.dismissed||[]).length?`<button class="btn" onclick="DB.dismissed=[];saveDB();render();toast('Dismissed alerts restored.')">Restore dismissed (${DB.dismissed.length})</button>`:""}
      <button class="btn pri" onclick="editTask()">Add a task</button></div>
  </div>
  <div class="grid g2" style="align-items:start">
    <div>
      ${block("Act now", group("High"))}
      ${block("This week", group("Medium"))}
      ${block("Keep an eye on", group("Low"))}
      ${!alerts.length?`<div class="card"><div class="empty"><b>No alerts</b><p>Placements, hours, observations and replies are all current.</p></div></div>`:""}
    </div>
    <div>
      <div class="card"><h3>My list</h3>
        ${open.length ? `<div class="list">${open.map(t => `<div class="row">
          <input type="checkbox" onchange="toggleTask('${t.id}')" style="margin-top:4px">
          <div class="gr"><div class="ttl">${esc(t.title)}</div>
            <div class="mt">${t.due?`Due ${fmtDate(t.due,true)}${t.due<today()?" · overdue":""}`:"No due date"}
              ${t.link?` · ${esc(t.link.kind==="school"?schName(t.link.id):stuName(t.link.id))}`:""}
              ${t.notes?` · ${esc(t.notes)}`:""}</div></div>
          ${statusTag(t.priority)}
          <button class="btn sm gh" onclick="editTask('${t.id}')">Edit</button></div>`).join("")}</div>`
          : `<p class="hint" style="margin:0">Nothing on your list.</p>`}
      </div>
      ${done.length?`<div class="card"><h3>Done</h3>
        <div class="list">${done.slice(-8).reverse().map(t => `<div class="row">
          <div class="gr"><div class="ttl" style="color:var(--ink3);text-decoration:line-through">${esc(t.title)}</div></div>
          <button class="btn sm gh" onclick="toggleTask('${t.id}')">Undo</button></div>`).join("")}</div></div>`:""}
    </div>
  </div>`;
};
function toggleTask(id){
  const t = tasks().find(x => x.id === id); if(!t) return;
  t.done = !t.done; saveDB(); render();
}
function editTask(id){
  const t = id ? tasks().find(x => x.id === id) : {title:"",due:addDays(today(),7),priority:"Medium",done:false,notes:"",link:null};
  openModal({title: id ? "Edit task" : "Add a task", narrow:true,
    body:`<label class="f">Task</label><input class="in" id="tk_t" value="${attr(t.title)}">
      <div class="fgrid" style="margin-top:10px">
        <div><label class="f">Due</label><input class="in" id="tk_d" type="date" value="${attr(t.due||"")}"></div>
        <div><label class="f">Priority</label><select class="in" id="tk_p">${selectOpts(["High","Medium","Low"],t.priority)}</select></div>
      </div>
      <label class="f" style="margin-top:10px">Notes</label><textarea class="in" id="tk_n">${esc(t.notes||"")}</textarea>`,
    foot:`${id?`<button class="btn dang" onclick="deleteTask('${id}')">Delete</button>`:""}
          <div class="fill"></div><button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn pri" id="tkSave">Save task</button>`,
    after(){ $("#tkSave").onclick = () => {
      if(!val("tk_t")) return toast("Give the task a name.", true);
      const rec = {title:val("tk_t"), due:val("tk_d")||null, priority:val("tk_p"), notes:val("tk_n")};
      if(id) Object.assign(tasks().find(x=>x.id===id), rec);
      else DB.tasks.push(Object.assign({id:uid("tk"), programId:P(), done:false, link:null}, rec));
      saveDB(); closeAllModals(); render(); toast("Task saved.");
    };}});
}
function deleteTask(id){
  DB.tasks = DB.tasks.filter(x => x.id !== id);
  saveDB(); closeAllModals(); render(); toast("Task deleted.");
}

/* =========================================================================
   Reports
   ========================================================================= */
const REPORTS = {
  placement:{name:"Students placed and unplaced", build(f){
    return {cols:["Student","Grade","Status","School","Teacher","Days","Start","End"],
      rows: filterStudents(f).map(s => { const p = activePlacement(s.id) || {};
        return [s.first+" "+s.last, s.grade, s.status, p.schoolId?schName(p.schoolId):"—",
          p.teacherId?tchName(p.teacherId):"—", (p.days||[]).join("/"), p.startDate||"", p.endDate||""]; })};
  }},
  bySchool:{name:"Placements by school", build(f){
    return {cols:["School","Level","Teachers","Filled","Open seats","Interns","Hours logged"],
      rows: schools().map(sc => { const pl = placements().filter(p => p.schoolId === sc.id && ["Active","Confirmed","Completed"].includes(p.status));
        return [sc.name, sc.level, teachers().filter(t=>t.schoolId===sc.id).length, schoolFilled(sc.id),
          schoolCapacity(sc.id), pl.map(p=>stuName(p.studentId)).join(", "),
          r1(pl.reduce((n,p)=>n+hoursDone(p.studentId),0))]; })};
  }},
  byGrade:{name:"Placements by grade level", build(f){
    const bands = {};
    placements().filter(p => p.status !== "Declined").forEach(p => {
      const b = bandFor((tch(p.teacherId)||{}).gradeLevel || "3");
      bands[b] = bands[b] || []; bands[b].push(p);
    });
    return {cols:["Grade band","Placements","Students"],
      rows: Object.keys(bands).map(b => [b, bands[b].length, bands[b].map(p=>stuName(p.studentId)).join(", ")])};
  }},
  byContent:{name:"Placements by content area", build(f){
    const m = {};
    placements().filter(p => p.status !== "Declined").forEach(p => {
      const c = (tch(p.teacherId)||{}).contentArea || "—";
      m[c] = m[c] || []; m[c].push(p);
    });
    return {cols:["Content area","Placements","Students"],
      rows: Object.keys(m).sort().map(c => [c, m[c].length, m[c].map(p=>stuName(p.studentId)).join(", ")])};
  }},
  hours:{name:"Internship hours", build(f){
    return {cols:["Student","School","Required","Completed","Remaining","% complete","Scheduled ahead","Pace"],
      rows: filterStudents(f).map(s => { const p = activePlacement(s.id)||{};
        const pace = onPace(s.id);
        return [s.first+" "+s.last, p.schoolId?schName(p.schoolId):"—", hoursRequired(s.id), hoursDone(s.id),
          hoursRemaining(s.id), pct(hoursDone(s.id),hoursRequired(s.id))+"%", scheduledHoursAhead(s.id),
          pace===null?"—":(pace<0?pace+" behind":"+"+pace)]; })};
  }},
  attendance:{name:"Attendance", build(f){
    return {cols:["Student","Sessions","Present","Late","Absent","Excused","Attendance %"],
      rows: filterStudents(f).map(s => { const ss = studentSessions(s.id).filter(x => x.status !== "Scheduled");
        const c = st => ss.filter(x => x.status === st).length;
        return [s.first+" "+s.last, ss.length, c("Present"), c("Late"), c("Absent"), c("Excused"),
          (attendanceRate(s.id)??"—")+(attendanceRate(s.id)===null?"":"%")]; })};
  }},
  observations:{name:"Observation completion", build(f){
    return {cols:["Student","School","Required","Completed","Scheduled","Overdue","Last observation"],
      rows: filterStudents(f).map(s => { const o = studentObs(s.id);
        const last = o.filter(x => x.status==="Completed").slice(-1)[0];
        return [s.first+" "+s.last, schName((activePlacement(s.id)||{}).schoolId), DB.settings.requiredObs,
          obsDone(s.id), o.filter(x=>x.status==="Scheduled").length, obsOverdue(s.id)?"yes":"no",
          last?last.date:"—"]; })};
  }},
  teachers:{name:"Cooperating teacher participation", build(f){
    return {cols:["Teacher","School","Grade","Content","Interns hosted","Capacity","Hours supervised"],
      rows: teachers().map(t => { const pl = placements().filter(p => p.teacherId===t.id && p.status!=="Declined");
        return [t.name, schName(t.schoolId), t.gradeLevel, t.contentArea, pl.length, t.maxInterns,
          r1(pl.reduce((n,p)=>n+hoursDone(p.studentId),0))]; })};
  }},
  completion:{name:"Students who met all requirements", build(f){
    return {cols:["Student","Hours","Required","Observations","Evaluation","Requirements met"],
      rows: filterStudents(f).map(s => { const ev = evaluations().find(e => e.studentId===s.id);
        const met = hoursDone(s.id) >= hoursRequired(s.id) && obsDone(s.id) >= DB.settings.requiredObs && !!ev;
        return [s.first+" "+s.last, hoursDone(s.id), hoursRequired(s.id), obsDone(s.id),
          ev?"on file":"missing", met?"yes":"no"]; })};
  }}
};
function filterStudents(f){
  return students().filter(s => {
    if(f.school){ const p = activePlacement(s.id); if(!p || p.schoolId !== f.school) return false; }
    if(f.grade && s.grade !== f.grade) return false;
    if(f.student && s.id !== f.student) return false;
    return s.status !== "Withdrawn" || f.includeWithdrawn;
  });
}
RENDER.reports = function(){
  const f = UI.filters.reports = UI.filters.reports || {which:"placement", school:"", grade:"", student:""};
  const rep = REPORTS[f.which];
  const data = rep.build(f);
  return `
  <div class="phead">
    <div><h1>Reports</h1><p>${esc(rep.name)} · ${data.rows.length} row${data.rows.length===1?"":"s"}.</p></div>
    <div class="sp"><button class="btn" onclick="downloadReport()">Export CSV</button>
      <button class="btn" onclick="wordReport()">Download Word</button>

  </div>
  <div class="toolbar">
    <select onchange="UI.filters.reports.which=this.value;render()">${selectOpts(
      Object.keys(REPORTS).map(k => ({v:k, l:REPORTS[k].name})), f.which)}</select>
    <select onchange="UI.filters.reports.school=this.value;render()">${selectOpts(schools().map(s=>({v:s.id,l:s.name})),f.school,"Any school")}</select>
    <select onchange="UI.filters.reports.grade=this.value;render()">${selectOpts(["9","10","11","12"],f.grade,"Any grade")}</select>
    <select onchange="UI.filters.reports.student=this.value;render()">${selectOpts(students().map(s=>({v:s.id,l:s.first+" "+s.last})),f.student,"All students")}</select>
    <div class="fill"></div><button class="btn sm gh" onclick="UI.filters.reports={which:'${f.which}',school:'',grade:'',student:''};render()">Clear</button>
  </div>
  ${table("report", data.cols.map((c,i) => ({k:"c"+i, label:c, num: typeof data.rows[0]?.[i] === "number"})),
    data.rows.map(r => ({__:Object.fromEntries(r.map((v,i)=>["c"+i,v])), cells:r.map(v => esc(v))})),
    `<b>No data for this report</b><p>Change the filters above.</p>`)}`;
};
function currentReport(){
  const f = UI.filters.reports;
  const rep = REPORTS[f.which];
  return {name:rep.name, data:rep.build(f)};
}
function downloadReport(){
  const r = currentReport();
  download("practicum-"+r.name.toLowerCase().replace(/[^a-z]+/g,"-")+"-"+today()+".csv",

/* =========================================================================
   CSV export of core tables
   ========================================================================= */
function exportCSV(what){
  let head, rows, name = what;
  if(what === "students"){
    head = ["First","Last","Preferred name","Student ID","Grade","Grad year","Email","Preferred grade","Content area",
      "Second content","Career","Requested teacher","TAM teacher","Transportation","Transportation notes","Status","School","Teacher",
      "Required hours","Completed hours","Remaining hours","Attendance %","Observations","Parent","Parent email","Parent phone",
      "School nurse","Notes"];
    rows = students().map(s => { const p = activePlacement(s.id)||{};
      return [s.first,s.last,s.preferredName||"",s.studentId,s.grade,s.gradYear,s.email,(s.prefBands||[]).join("; "),
        (s.prefContent||[]).join("; "),(s.secondContent||[]).join("; "),s.career,s.teacherRequest||"",s.tamTeacher||"",
        s.transport,s.transportNotes,
        s.status, p.schoolId?schName(p.schoolId):"", p.teacherId?tchName(p.teacherId):"",
        hoursRequired(s.id), hoursDone(s.id), hoursRemaining(s.id), attendanceRate(s.id)??"", obsDone(s.id),
        s.parentName,s.parentEmail,s.parentPhone,s.schoolNurse||"",s.notes]; });
  } else if(what === "schools"){
    head = ["School","Level","Address","Contact","Contact email","Phone","Distance (mi)","Drive (min)",
      "Placements offered","Teachers","Filled","Open seats","Active","Notes"];
    rows = schools().map(s => [s.name,s.level,s.address,s.contactName,s.contactEmail,s.phone,s.distanceMiles,
      s.driveMinutes,s.capacity,teachers().filter(t=>t.schoolId===s.id).length,schoolFilled(s.id),
      schoolCapacity(s.id),s.active?"yes":"no",s.notes]);
  } else if(what === "teachers"){
    head = ["Teacher","Email","School","Grade","Content area","Days","Preferred interns","Maximum","Assigned",
      "Special educator","Program","TAM site","Notes"];
    rows = teachers().map(t => [t.name,t.email,schName(t.schoolId),t.gradeLevel,t.contentArea,t.days.join("; "),
      t.preferredInterns,t.maxInterns,teacherLoad(t.id),t.specialEducator?"yes":"no",t.program||"",t.tamSite||"",t.notes]);
  } else if(what === "placements"){
    head = ["Student","School","Teacher","Days","Start time","End time","First day","Last day","Status","Notes"];
    rows = placements().map(p => [stuName(p.studentId),schName(p.schoolId),tchName(p.teacherId),p.days.join("; "),
      p.startTime,p.endTime,p.startDate,p.endDate,p.status,p.notes]);
  } else if(what === "sessions"){
    head = ["Date","Day","Student","School","Teacher","Scheduled start","Scheduled end","Actual start","Actual end",
      "Hours","Status","Activity","Verified","Reflection"];
    rows = sessions().sort((a,b)=>a.date<b.date?-1:1).map(s => { const p = plc(s.placementId)||{};
      return [s.date,dayAbbr(s.date),stuName(s.studentId),schName(p.schoolId),tchName(p.teacherId),
        s.schedStart,s.schedEnd,s.actualStart||"",s.actualEnd||"",s.hours||0,s.status,s.activity,
        s.verified?"yes":"no",s.reflection]; });
  } else if(what === "observations"){
    head = ["Date","Time","Student","School","Teacher","Status","Follow-up","Strengths","Areas for growth","Notes"];
    rows = observations().map(o => { const p = plc(o.placementId)||{};
      return [o.date,o.time,stuName(o.studentId),schName(p.schoolId),tchName(p.teacherId),o.status,
        o.followUp?"yes":"no",o.strengths,o.growth,o.notes]; });
  } else if(what === "comms"){
    head = ["Date","Type","Recipient kind","Recipient","Subject","Status","Follow-up","Student"];
    rows = comms().map(c => [c.date,c.type,c.recipientKind,commRecipientLabel(c),c.subject,c.status,
      c.followUp||"",c.studentId?stuName(c.studentId):""]);
  } else return;
  download("practicum-"+name+"-"+today()+".csv", toCSV(head, rows));
  toast(rows.length+" row"+(rows.length===1?"":"s")+" exported.");
}

function printDoc(title, inner, asPdf){
  const css = `
    @page{size:8.5in 11in;margin:1in}

    body{font:11.5pt/1.55 Georgia,"Times New Roman",serif;color:#18212B;width:6.5in}

    .meta{font:9.5pt Helvetica,Arial,sans-serif;color:#555;margin-bottom:14pt}

    .box{border:1px solid #999;padding:8pt;margin:8pt 0}
    .sig{margin-top:22pt;display:flex;gap:28pt}
    .sig div{flex:1;border-top:1px solid #333;padding-top:4pt;font:9pt Helvetica,Arial,sans-serif}

    .lines div{border-bottom:.5px solid #bbb;height:22pt}
    .pb{page-break-before:always}
    h1,h2{page-break-after:avoid}
    table,.box,.sig{page-break-inside:avoid}
  `;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
    <style>${css}</style></head><body>${inner}
    <div class="foot">${esc(prog().name)} · ${esc(prog().facilitator)} · ${esc(prog().email)} · generated ${fmtDateFull(today())}</div>

    const w = window.open("", "_blank"); if(w){ w.document.write(html); w.document.close(); w.print(); } } };
}

function printCalendar(){
  const start = UI.calDate || today();
  const d = parseISO(start);
  const from = iso(new Date(d.getFullYear(), d.getMonth(), 1));
  const to = iso(new Date(d.getFullYear(), d.getMonth()+1, 0));
  const days = [];
  for(let x = from; x <= to; x = addDays(x,1)){ const it = dayItems(x); if(it.length) days.push({x, it}); }
  printDoc("Calendar", `<h1>${esc(d.toLocaleString("en-US",{month:"long",year:"numeric"}))}</h1>

}

   Email template editor — edit the wording once, keep the merge fields

function mergeFieldHelp(){
  return `<details style="margin-top:10px"><summary style="cursor:pointer;font-size:12.5px;color:var(--accent)">Merge fields you can drop in</summary>
    <div class="chips" style="margin-top:8px">${MERGE_FIELDS.map(([k,d]) =>
      `<label title="${attr(d)}" style="cursor:pointer" onclick="insertField('${k}')"><span class="mono">{{${esc(k)}}}</span></label>`).join("")}</div>
    <p class="hint">Click one to drop it where the cursor is. Anything not on this list is left exactly as you typed it.</p></details>`;
}
let FIELD_TARGET = "tpl_body";
function insertField(key){
  const el = document.getElementById(FIELD_TARGET);
  if(!el) return;
  const tok = "{{"+key+"}}";
  const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
  el.value = el.value.slice(0,a) + tok + el.value.slice(b);
  el.focus(); el.selectionStart = el.selectionEnd = a + tok.length;
  el.dispatchEvent(new Event("input"));
}
function editTemplate(type, fromComposer){
  const t = templateFor(type);
  const edited = isEditedTemplate(type), custom = isCustomTemplate(type);
  openModal({title:"Email template — "+type, wide:true,
    body:`<p class="hint" style="margin-top:0">${custom ? "A template you created."
        : edited ? "You have edited this one. The original wording is still available to restore."
        : "The wording that ships with Practicum. Change anything you like."}</p>
      <label class="f">Subject line</label>
      <input class="in" id="tpl_subj" value="${attr(t.s)}" onfocus="FIELD_TARGET='tpl_subj'">
      <label class="f" style="margin-top:10px">Message</label>
      <textarea class="in" id="tpl_body" style="min-height:320px" onfocus="FIELD_TARGET='tpl_body'">${esc(t.b)}</textarea>
      ${mergeFieldHelp()}
      <div class="card" style="margin-top:12px;background:#FBFCF9"><h3>Preview</h3>
        <div class="sub">Filled in with the first student on your roster.</div>
        <div id="tpl_prev" style="white-space:pre-wrap;font-size:13px;line-height:1.6"></div></div>`,
    foot:`${custom ? `<button class="btn dang" onclick="deleteTemplate('${attr(type)}')">Delete template</button>`
          : edited ? `<button class="btn" onclick="restoreTemplate('${attr(type)}')">Restore original</button>` : ""}
          <div class="fill"></div><button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn pri" id="tplSave">Save template</button>`,
    after(){
      const prev = () => {
        const s = students()[0];
        const m = mergeFields({studentId: s ? s.id : null});
        $("#tpl_prev").textContent = fillTemplate(val("tpl_subj"), m) + "\n\n" + fillTemplate($("#tpl_body").value, m);
      };
      $("#tpl_subj").oninput = prev; $("#tpl_body").oninput = prev; prev();
      $("#tplSave").onclick = () => {
        DB.settings.templates = DB.settings.templates || {};
  DB.settings.formOverrides = DB.settings.formOverrides || {};
        DB.settings.templates[type] = {s: val("tpl_subj"), b: $("#tpl_body").value};
        saveDB(); closeModal(); if(!fromComposer) render();
        toast("Template saved. New emails of this type use it from now on.");
      };
    }});
}
function restoreTemplate(type){
  delete DB.settings.templates[type];
  saveDB(); closeModal(); render(); toast("Original wording restored.");
}
function deleteTemplate(type){
  confirmAction("Delete the “"+type+"” template?", "Emails already logged under this type are not affected.", () => {
    delete DB.settings.templates[type];
    saveDB(); closeAllModals(); render(); toast("Template deleted.");
  });
}
function newTemplate(){
  openModal({title:"New email template", narrow:true,
    body:`<label class="f">What is this email for?</label>

/* ---- data blocks a form can drop in ------------------------------------ */
const FORM_BLOCKS = [
  ["table: hours","Every logged session with dates, times and hours"],
  ["table: schedule","Sessions still to come"],
  ["table: observations","Observation dates, strengths and growth areas"],
  ["table: evaluation","End-of-internship ratings and comments"],
  ["table: communications","Every message sent about this student"],
  ["table: interns","Interns assigned to this teacher or school"],
  ["table: teachers","Cooperating teachers at this school"],
  ["table: rubric","Blank rubric with a rating column to fill in by hand"],
  ["lines: 4","Blank writing lines"],
  ["box","A bordered box around the text that follows"],
  ["signatures: A | B","Signature rules side by side"],
  ["break","Start a new page"]
];
function tbl(head, rows, empty){
  if(!rows.length) return "<p>"+esc(empty || "None on file.")+"</p>";
  return "<table><thead><tr>"+head.map(h => "<th>"+esc(h)+"</th>").join("")+"</tr></thead><tbody>"+
    rows.map(r => "<tr>"+r.map(c => "<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
}
function formTable(kind, ctx){
  const sid = ctx.studentId, tid = ctx.teacherId, scid = ctx.schoolId;
  if(kind === "hours"){
    const list = sid ? studentSessions(sid).filter(x => x.status !== "Scheduled") : [];
    return tbl(["Date","Scheduled","Actual","Hours","Status","Activity","Verified"],
      list.map(x => [fmtDate(x.date,true), timeRange(x.schedStart,x.schedEnd),
        x.actualStart?timeRange(x.actualStart,x.actualEnd):"—", x.hours||0, x.status, x.activity||"", x.verified?"yes":""]),
      "No sessions logged yet.");
  }
  if(kind === "schedule"){
    const list = sid ? studentSessions(sid).filter(x => x.status === "Scheduled" && x.date >= today()) : [];
    return tbl(["Date","Day","Time","School","Hours"],
      list.map(x => { const p = plc(x.placementId)||{};
        return [fmtDate(x.date,true), dayAbbr(x.date), timeRange(x.schedStart,x.schedEnd),
          schName(p.schoolId), r1(hoursBetween(x.schedStart,x.schedEnd))]; }),
      "Nothing scheduled ahead.");
  }
  if(kind === "observations"){
    const list = sid ? studentObs(sid) : [];
    return list.length ? list.map(o => `<div class="box"><b>${fmtDateFull(o.date)} · ${esc(fmtTime(o.time))} · ${esc(o.status)}</b>
      ${o.notes?`<p>${esc(o.notes)}</p>`:""}
      ${o.strengths?`<p><b>Strengths:</b> ${esc(o.strengths)}</p>`:""}
      ${o.growth?`<p><b>Areas for growth:</b> ${esc(o.growth)}</p>`:""}</div>`).join("")
      : "<p>No observations on file.</p>";
  }
  if(kind === "evaluation"){
    const ev = sid ? evaluations().find(e => e.studentId === sid) : null;
    if(!ev) return "<p>Not yet submitted.</p>";
    return tbl(["Area","Rating"], RUBRIC.map(k => [k, (ev.ratings[k]||0)+" of 4"])) +
      `<p>${esc(ev.comments||"")}</p><p><b>Recommendation:</b> ${esc(ev.recommendation||"—")}</p>
       <p class="meta">Submitted ${fmtDateFull(ev.date)} by ${esc(ev.submittedBy||"")}</p>`;
  }
  if(kind === "communications"){
    const list = sid ? comms().filter(c => c.studentId === sid ||
      (c.recipientKind === "student" && c.recipientIds.includes(sid))) : [];
    return tbl(["Date","Type","To","Subject","Status"],
      list.map(c => [fmtDate(c.date), c.type, commRecipientLabel(c), c.subject, c.status]),
      "Nothing logged.");
  }
  if(kind === "interns"){
    let list = [];
    if(tid) list = placements().filter(p => p.teacherId === tid && p.status !== "Declined");
    else if(scid) list = placements().filter(p => p.schoolId === scid && p.status !== "Declined");
    return tbl(["Student","Grade","Teacher","Days","Time","Hours","Status"],
      list.map(p => { const st = stu(p.studentId) || {};
        return [stuName(p.studentId), st.grade||"", tchName(p.teacherId), p.days.join(", "),
          timeRange(p.startTime,p.endTime), hoursDone(p.studentId)+" / "+hoursRequired(p.studentId), p.status]; }),
      "No interns assigned.");
  }
  if(kind === "teachers"){
    const list = scid ? teachers().filter(t => t.schoolId === scid)
      : (tid ? teachers().filter(t => t.id === tid) : []);
    return tbl(["Teacher","Email","Grade","Content","Days","Interns"],
      list.map(t => [t.name, t.email, t.gradeLevel, t.contentArea, t.days.join(", "),
        teacherLoad(t.id)+" / "+t.maxInterns]), "No teachers on file.");
  }
  if(kind === "rubric") return tbl(["Area","Rating (0–4)","Comments"], RUBRIC.map(k => [k,"",""]));
  return "";
}
function renderFormBody(text, m, ctx){
  ctx = ctx || {};
  const out = [];
  fillTemplate(text, m).split(/\n{2,}/).forEach(raw => {
    const block = raw.trim();
    if(!block) return;
    if(/^##\s+/.test(block)){ out.push("<h2>"+esc(block.replace(/^##\s+/,""))+"</h2>"); return; }
    const tb = block.match(/^\[\[\s*table\s*:\s*([a-zA-Z]+)\s*\]\]$/i);
    if(tb){ out.push(formTable(tb[1].toLowerCase(), ctx)); return; }
    const sig = block.match(/^\[\[\s*signatures?\s*:(.+?)\]\]$/i);
    if(sig){ out.push('<div class="sig">'+sig[1].split("|").map(x => "<div>"+esc(x.trim())+"</div>").join("")+"</div>"); return; }
    const ln = block.match(/^\[\[\s*lines?\s*:\s*(\d+)\s*\]\]$/i);
    if(ln){ out.push('<div class="lines">'+'<div></div>'.repeat(Math.min(30,+ln[1]))+"</div>"); return; }
    const box = block.match(/^\[\[\s*box\s*\]\]\s*([\s\S]*)$/i);
    if(box){ out.push('<div class="box">'+esc(box[1]).replace(/\n/g,"<br>")+"</div>"); return; }
    if(/^\[\[\s*break\s*\]\]$/i.test(block)){ out.push('<div class="pb"></div>'); return; }
    const rows = block.split("\n");
    if(rows.length > 1 && rows.every(r => /^[^:\n]{1,44}:\s?/.test(r))){
      out.push("<dl>"+rows.map(r => { const i = r.indexOf(":");
        return "<dt>"+esc(r.slice(0,i))+"</dt><dd>"+esc(r.slice(i+1).trim())+"</dd>"; }).join("")+"</dl>");
      return;
    }
    out.push("<p>"+esc(block).replace(/\n/g,"<br>")+"</p>");
  });
  return out.join("");
}
/* one rendered copy of a form for one subject */
function renderFormFor(form, subjectId){
  const ctx = {};
  if(form.scope === "teacher"){ const t = tch(subjectId); ctx.teacherId = subjectId; ctx.schoolId = t ? t.schoolId : null; }
  else if(form.scope === "school"){ ctx.schoolId = subjectId; }
  else { const p = activePlacement(subjectId) || placements().find(x => x.studentId === subjectId);
    ctx.studentId = subjectId; ctx.teacherId = p ? p.teacherId : null; ctx.schoolId = p ? p.schoolId : null; }
  const m = mergeFields(ctx);
  return `<h1>${esc(fillTemplate(form.name, m))}</h1>
    <div class="meta">${form.subtitle?esc(fillTemplate(form.subtitle,m))+" · ":""}${esc(subjectLabel(form.scope, subjectId))} · ${esc(prog().name)} · ${fmtDateFull(today())}</div>
    ${renderFormBody(form.body, m, ctx)}`;
}
function subjectLabel(scopeKind, id){
  return scopeKind === "teacher" ? tchName(id) : scopeKind === "school" ? schName(id) : stuName(id);
}
function subjectsFor(scopeKind){
  return scopeKind === "teacher" ? teachers().map(t => ({v:t.id, l:t.name+" — "+schName(t.schoolId)}))
    : scopeKind === "school" ? schools().map(s => ({v:s.id, l:s.name}))
    : students().filter(s => s.status !== "Withdrawn").map(s => ({v:s.id, l:s.first+" "+s.last+" (grade "+s.grade+")"}));
}
/* ---- output: print, PDF via the print dialog, or an editable Word file -- */
function generateDocs(formId, ids, mode){
  const form = formById(formId);
  if(!form) return toast("That form is gone.", true);
  if(!ids || !ids.length) return toast("Choose at least one person first.", true);
  const inner = ids.map(id => renderFormFor(form, id)).join('<div class="pb"></div>');
  const title = form.name + (ids.length > 1 ? " — "+ids.length+" copies" : " — "+subjectLabel(form.scope, ids[0]));
  if(mode === "word") wordDoc(slug(form.name)+"-"+today()+".doc", title, inner);
  else printDoc(title, inner, mode === "pdf");
  if(ids.length > 1 && mode !== "word") toast(ids.length+" copies in one job, one per page.");
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function wordDoc(filename, title, inner){
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">

      table{width:100%;border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:9.5pt;margin:6pt 0}
      th{text-align:left;border-bottom:1.5pt solid #333;padding:4pt 5pt}
      td{border-bottom:.5pt solid #ccc;padding:4pt 5pt;vertical-align:top}
      dl{margin:6pt 0}

      .lines div{border-bottom:.5pt solid #bbb;height:22pt}

/* =========================================================================
   The document generator — pick a form, pick who it is for, choose a format
   ========================================================================= */
function openDocuments(formId){
  UI.doc = UI.doc || {form:"bi_profile", ids:[], filterSchool:"", filterStatus:""};
  if(formId) UI.doc.form = formId;
  drawDocuments();
}
function drawDocuments(){
  const d = UI.doc, form = formById(d.form) || allForms()[0];
  d.form = form.id;
  let subjects = subjectsFor(form.scope);
  if(form.scope === "student"){
    subjects = subjects.filter(o => {
      const s = stu(o.v);
      if(d.filterSchool){ const p = activePlacement(s.id); if(!p || p.schoolId !== d.filterSchool) return false; }
      if(d.filterStatus && s.status !== d.filterStatus) return false;
      return true;
    });
  }
  const valid = new Set(subjects.map(o => o.v));
  d.ids = (d.ids || []).filter(id => valid.has(id));
  const sel = new Set(d.ids);
  closeAllModals();
  openModal({title:"Generate documents", wide:true,
    body:`<div class="fgrid">
        <div class="full"><label class="f">Document</label>
          <select class="in" id="doc_form" onchange="UI.doc.form=this.value;UI.doc.ids=[];drawDocuments()">
            <optgroup label="Built in">${BUILTIN_FORMS.map(f => {
              const cur = formById(f.id);
              return `<option value="${f.id}" ${f.id===d.form?"selected":""}>${esc(cur.name)}${isEditedForm(f.id)?" (edited)":""}</option>`;}).join("")}</optgroup>
            ${forms().length?`<optgroup label="Your forms">${forms().map(f =>
              `<option value="${f.id}" ${f.id===d.form?"selected":""}>${esc(f.name)}</option>`).join("")}</optgroup>`:""}
          </select>
          <div class="hint">${esc(form.desc || "Custom form")} · one ${esc(form.scope)} per page · letter paper, one-inch margins.</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin:14px 0 8px;flex-wrap:wrap">
        <b style="font-size:13px">Generate for</b>
        <span class="hint" id="doc_count">${d.ids.length} selected of ${subjects.length}</span>
        <div class="fill" style="flex:1"></div>
        ${form.scope==="student"?`
          <select onchange="UI.doc.filterSchool=this.value;drawDocuments()" style="padding:5px;border:1px solid var(--line2);border-radius:4px">
            ${selectOpts(schools().map(s=>({v:s.id,l:s.name})), d.filterSchool, "Any school")}</select>
          <select onchange="UI.doc.filterStatus=this.value;drawDocuments()" style="padding:5px;border:1px solid var(--line2);border-radius:4px">
            ${selectOpts(STU_STATUS, d.filterStatus, "Any status")}</select>`:""}
        <button class="btn sm" onclick="docSelectAll(true)">Select all</button>
        <button class="btn sm" onclick="docSelectAll(false)">Clear</button>
      </div>
      <div class="list" style="max-height:280px;overflow-y:auto">
        ${subjects.length ? subjects.map(o => `<div class="row" style="padding:6px 12px">
          <input type="checkbox" class="docpick" value="${attr(o.v)}" ${sel.has(o.v)?"checked":""} onchange="docPickChanged()">
          <div class="gr"><div class="ttl" style="font-weight:400">${esc(o.l)}</div></div></div>`).join("")
          : `<div class="empty" style="padding:18px"><b>Nobody matches</b><p>Loosen the filters above.</p></div>`}
      </div>
      <p class="hint">Selecting several people produces one job with a page break between each — print it once, or save
        the whole set as a single PDF or Word file.</p>`,
    foot:`<button class="btn" onclick="editForm('${form.id}')">Edit this document</button>
          <button class="btn" onclick="docPreview()">Preview</button>
          <div class="fill"></div>
          <button class="btn" onclick="docRun('word')">Download Word</button>
          <button class="btn" onclick="docRun('pdf')">Save as PDF</button>
          <button class="btn pri" onclick="docRun('print')">Print</button>`});
}
function docPicks(){ return Array.from(document.querySelectorAll(".docpick:checked")).map(c => c.value); }
function docPickChanged(){
  UI.doc.ids = docPicks();
  const c = $("#doc_count");
  if(c) c.textContent = UI.doc.ids.length + " selected of " + document.querySelectorAll(".docpick").length;
}
function docSelectAll(on){

function docRun(mode){

      <div class="fgrid">

      </div>
      <label class="f" style="margin-top:10px">Body</label>
      <textarea class="in" id="fm_body" style="min-height:320px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px"
        onfocus="FIELD_TARGET='fm_body'">${esc(f.body||"")}</textarea>
      <p class="hint"><span class="mono">## Heading</span> starts a section ·
        <span class="mono">Label: value</span> lines become a labelled block · everything else is a paragraph.</p>
      ${mergeFieldHelp()}
      <details style="margin-top:8px"><summary style="cursor:pointer;font-size:12.5px;color:var(--accent)">Data blocks you can drop in</summary>
        <div class="list" style="margin-top:8px">${FORM_BLOCKS.map(([k,d]) => `<div class="row" style="padding:6px 10px">
          <div class="gr"><span class="mono">[[${esc(k)}]]</span><div class="mt">${esc(d)}</div></div>
          <button class="btn sm gh" onclick="insertBlock('${attr(k)}')">Insert</button></div>`).join("")}</div></details>
      <div class="card" style="margin-top:12px;background:#FBFCF9"><h3>Preview</h3>
        <div class="sub">Filled in with the first record on file, at the width it prints.</div>
        <div id="fm_prev" class="paper"></div></div>`,
    foot:`${builtin && isEditedForm(id) ? `<button class="btn" onclick="restoreForm('${id}')">Restore original</button>` : ""}
          ${!builtin && id ? `<button class="btn dang" onclick="deleteForm('${id}')">Delete</button>` : ""}
          <div class="fill"></div><button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn pri" id="fmSave">Save document</button>`,
    after(){
      const prev = () => {
        const sc = builtin ? f.scope : (document.getElementById("fm_scope") ? val("fm_scope") : f.scope);
        const first = (subjectsFor(sc)[0] || {}).v;
        if(!first){ $("#fm_prev").innerHTML = `<p class="hint">Nothing on file yet to preview against.</p>`; return; }
        $("#fm_prev").innerHTML = renderFormFor(
          {name:val("fm_name")||"Untitled", subtitle:val("fm_sub"), scope:sc, body:$("#fm_body").value}, first);
      };
      $("#fm_body").oninput = prev; $("#fm_name").oninput = prev; prev();
      $("#fmSave").onclick = () => {
        if(!val("fm_name")) return toast("Give the document a name.", true);
        const rec = {name:val("fm_name"), subtitle:val("fm_sub"), desc:val("fm_desc"), body:$("#fm_body").value};
        if(builtin){ formOverrides()[id] = rec; }
        else if(id){ Object.assign(forms().find(x => x.id === id), rec, {scope:val("fm_scope")}); }
        else { DB.forms.push(Object.assign({id:uid("form"), programId:P(), scope:val("fm_scope")}, rec)); }
        saveDB(); closeAllModals(); render();
        toast(id ? "Document saved." : "Form created — it is in the document list now.");
      };
    }});
}
function insertBlock(k){
  const el = document.getElementById("fm_body");
  if(!el) return;
  const tok = "\n\n[["+k+"]]\n\n";
  const a = el.selectionStart ?? el.value.length;
  el.value = el.value.slice(0,a) + tok + el.value.slice(a);
  el.focus(); el.selectionStart = el.selectionEnd = a + tok.length;
  el.dispatchEvent(new Event("input"));
}
function restoreForm(id){
  delete formOverrides()[id];
  saveDB(); closeAllModals(); render(); toast("Original layout restored.");
}
function deleteForm(id){
  const f = forms().find(x => x.id === id);
  confirmAction("Delete the “"+f.name+"” form?", "Copies you have already printed or downloaded are unaffected.", () => {
    DB.forms = DB.forms.filter(x => x.id !== id);
    saveDB(); closeAllModals(); render(); toast("Form deleted.");
  });
}

/* =========================================================================
   Settings, programs, backup
   ========================================================================= */

          <div><label class="f">Facilitator</label><input class="in" id="st_fac" value="${attr(p.facilitator)}"></div>
          <div><label class="f">Email</label><input class="in" id="st_femail" value="${attr(p.email)}"></div>

          <div><label class="f">Term starts</label><input class="in" id="st_ts" type="date" value="${attr(s.termStart)}"></div>

          <div><label class="f">Default end time</label><input class="in" id="st_de" type="time" value="${attr(s.defaultEnd)}"></div>
          <div><label class="f">Flag after this many absences</label><input class="in" id="st_abs" type="number" value="${s.absenceAlert}"></div>
          <div><label class="f">Days before an observation is overdue</label><input class="in" id="st_grace" type="number" value="${s.obsGraceDays}"></div>
        </div>
        <p class="hint">Changing the required hours affects every student who does not have their own override.</p>
        <div style="margin-top:8px"><button class="btn pri" onclick="saveSettings()">Save settings</button></div>
      </div>
      <div class="card"><h3>Email templates</h3>
        <p class="sub">The wording Practicum suggests for each type of email. Edit any of them; the names and dates keep filling themselves in.</p>
        <div class="list">${emailTypes().filter(t=>t!=="Custom").map(t => `<div class="row">
          <div class="gr"><div class="ttl">${esc(t)}</div>
            <div class="mt">${esc((templateFor(t).s || "No subject line yet").slice(0,72))}</div></div>
          ${isCustomTemplate(t)?`<span class="tag t-plum">yours</span>`:isEditedTemplate(t)?`<span class="tag t-gold">edited</span>`:""}
          <button class="btn sm" onclick="editTemplate('${attr(t)}')">Edit</button></div>`).join("")}</div>
        <div style="margin-top:10px"><button class="btn" onclick="newTemplate()">Add a template</button></div>
      </div>
      <div class="card"><h3>Forms and documents</h3>
        <p class="sub">Printable forms built from records already on file, sized for letter paper with one-inch margins.</p>
        <div class="list">${allForms().map(f => `<div class="row">
          <div class="gr"><div class="ttl">${esc(f.name)}</div><div class="mt">${esc(f.desc||"Custom form")}</div></div>
          ${f.builtin ? (isEditedForm(f.id)?`<span class="tag t-gold">edited</span>`:`<span class="tag t-slate">built in</span>`)
                      : `<span class="tag t-plum">yours</span>`}
          <button class="btn sm gh" onclick="openDocuments('${f.id}')">Generate</button>
          <button class="btn sm" onclick="editForm('${f.id}')">Edit</button></div>`).join("")}</div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn" onclick="editForm()">Build a form</button>

      </div>
    </div>
    <div>
      <div class="card"><h3>Programs</h3>
        <p class="sub">Each program keeps its own students, schools, teachers and calendar. Nothing crosses between them.</p>
        <div class="list">${DB.programs.map(pr => `<div class="row">
          <div class="gr"><div class="ttl">${esc(pr.name)}${pr.id===P()?` <span class="tag t-accent">open</span>`:""}</div>

              ${DB.schools.filter(x=>x.programId===pr.id).length} schools</div></div>

        </div>

          ${DB.students.length} students, ${DB.sessions.length} sessions, ${DB.comms.length} messages on file.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn dang" onclick="startEmpty()">Erase the sample data</button>
          <button class="btn" onclick="resetAll()">Put the sample data back</button></div>

        </div>
